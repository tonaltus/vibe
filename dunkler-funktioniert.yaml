alias: "Helligkeit verringern mit Hue Tap Dial (Taste 1 + Drehen links)"
description: ""
mode: single
trigger:
  - platform: state
    entity_id: sensor.dach_tap_dial_action
    to: "1_rotate_left"
condition:
  - condition: state
    entity_id: sensor.dach_tap_dial_action
    state: "1_hold"
action:
  - service: light.turn_on
    target:
      entity_id: light.dach_lampe_tv
    data:
      brightness_step: -25
      transition: 0.1
  - delay: "0.1"
  - repeat:
      while:
        - condition: state
          entity_id: sensor.dach_tap_dial_action
          state: "1_rotate_left"
      sequence:
        - service: light.turn_on
          target:
            entity_id: light.dach_lampe_tv
          data:
            brightness_step: -25
            transition: 0.1
        - delay: "0.1"