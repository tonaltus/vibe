alias: "SONOFF Button - Dachlampen Steuerung"
description: >
  Steuerung der Dachlampen mit SONOFF SNZB-01P:
  - Single Press: Toggle aller Lampen
  - Double Press: Alle Lampen auf 100% Helligkeit
  - Long Press: Alle Lampen aus

triggers:
  - device_id: 0x7cc6b6fffe395bc1
    domain: mqtt
    type: action
    subtype: button_1_press
    trigger: device
  - device_id: 0x7cc6b6fffe395bc1
    domain: mqtt
    type: action
    subtype: button_1_double_press
    trigger: device
  - device_id: 0x7cc6b6fffe395bc1
    domain: mqtt
    type: action
    subtype: button_1_hold
    trigger: device

actions:
  - choose:
      # Single Press: Toggle
      - conditions:
          - condition: template
            value_template: "{{ trigger.subtype == 'button_1_press' }}"
        sequence:
          - service: light.toggle
            target:
              entity_id:
                - light.dach_lampe_tv
                - light.dach_dimmer_garten_unten_links
                - light.dach_dimmer_wand

      # Double Press: Alle auf 100%
      - conditions:
          - condition: template
            value_template: "{{ trigger.subtype == 'button_1_double_press' }}"
        sequence:
          - service: light.turn_on
            target:
              entity_id:
                - light.dach_lampe_tv
                - light.dach_dimmer_garten_unten_links
                - light.dach_dimmer_wand
            data:
              brightness_pct: 100

      # Long Press: Alle aus
      - conditions:
          - condition: template
            value_template: "{{ trigger.subtype == 'button_1_hold' }}"
        sequence:
          - service: light.turn_off
            target:
              entity_id:
                - light.dach_lampe_tv
                - light.dach_dimmer_garten_unten_links
                - light.dach_dimmer_wand
    default: []

mode: single