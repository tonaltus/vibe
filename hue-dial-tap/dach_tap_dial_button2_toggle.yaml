alias: "Toggle Dach-Dimmer-Wand mit Dach-tap-dial (Gerätezuordnung)"
description: >
  # ===== ZWECK =====
  # Toggle für Dach-Dimmer-Wand mit Hue Tap Dial (Taste 2)
  #
  # ===== GERÄTE =====
  # - Schalter: Dach-tap-dial (device_id: afbc0fec6dfd2c36ba252295054f7188)
  # - Lampe: light.dach_dimmer_wand
  #
  # ===== TRIGGER =====
  # - platform: device
  # - subtype: button_2_press (aus Zigbee2MQTT-Logs)
triggers:
  - device_id: afbc0fec6dfd2c36ba252295054f7188
    domain: mqtt
    type: action
    subtype: button_2_press
    trigger: device
actions:
  - target:
      entity_id: light.dach_dimmer_wand
    action: light.toggle
mode: single