---
# YAML-Konfiguration für Home Assistant zur Steuerung der Helligkeit einer Hue White Ambiance Lampe
# mit einem Hue Tap Dial Switch über Zigbee2MQTT

# Automatisierung für die Helligkeitssteuerung
automation:
  - alias: "Helligkeit erhöhen mit Hue Tap Dial (Taste 1 + Drehen rechts)"
    trigger:
      - platform: state
        entity_id: sensor.dach_tap_dial_action
        to: "1_rotate_right"
    condition:
      - condition: state
        entity_id: sensor.dach_tap_dial_action
        state: "1_hold"
    action:
      - service: light.turn_on
        target:
          entity_id: light.dach_lampe_tv
        data:
          brightness_step: 25  # Erhöht die Helligkeit in Schritten von 25
          transition: 0.1
      - delay: "0.1"
      - repeat:
          while:
            - condition: state
              entity_id: sensor.dach_tap_dial_action
              state: "1_rotate_right"
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.dach_lampe_tv
              data:
                brightness_step: 25
                transition: 0.1
            - delay: "0.1"

  - alias: "Helligkeit verringern mit Hue Tap Dial (Taste 1 + Drehen links)"
    trigger:
      - platform: state
        entity_id: sensor.dach_tap_dial_action
        to: "1_rotate_left"
    condition:
      - condition: state
        entity_id: sensor.dach_tap_dial_action
        state: "1_hold"
    action:
      - service: light.turn_on
        target:
          entity_id: light.dach_lampe_tv
        data:
          brightness_step: -25  # Verringert die Helligkeit in Schritten von 25
          transition: 0.1
      - delay: "0.1"
      - repeat:
          while:
            - condition: state
              entity_id: sensor.dach_tap_dial_action
              state: "1_rotate_left"
          sequence:
            - service: light.turn_on
              target:
                entity_id: light.dach_lampe_tv
              data:
                brightness_step: -25
                transition: 0.1
            - delay: "0.1"

# Sensor-Konfiguration für den Hue Tap Dial Switch
# (Annahme: Der Hue Tap Dial Switch sendet seine Aktionen als Sensor-Werte)
sensor:
  - platform: mqtt
    name: "Dach-Tap-Dial-Action"
    state_topic: "zigbee2mqtt/Dach-tap-dial"
    value_template: >-
      {% if value_json.action == '1_rotate_right' %}
        1_rotate_right
      {% elif value_json.action == '1_rotate_left' %}
        1_rotate_left
      {% elif value_json.action == '1_hold' %}
        1_hold
      {% elif value_json.action == '1_release' %}
        1_release
      {% else %}
        {{ value_json.action }}
      {% endif %}

# Licht-Konfiguration für die Hue White Ambiance Lampe
light:
  - platform: mqtt
    name: "Dach-Lampe-TV"
    state_topic: "zigbee2mqtt/Dach-Lampe-TV"
    availability_topic: "zigbee2mqtt/bridge/state"
    command_topic: "zigbee2mqtt/Dach-Lampe-TV/set"
    brightness: true
    schema: json
    color_mode: xy
    supported_color_modes:
      - xy
      - brightness